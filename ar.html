        left: 2rem;
        background: rgba(10, 14, 39, 0.9);

<div class="ar-status">

<div class="ar-ui">
    <button class="ar-button" id="toggleDrawingBtn">✏️ Start Drawing</button>
    <button class="ar-button secondary" id="undoBtn" disabled>↶ Undo</button>
    <button class="ar-button secondary" id="clearBtn" disabled>🗑️ Clear</button>
    <button class="ar-button" id="exportBtn" disabled>💾 Export</button>
</div>

<div class="instruction-overlay" id="instructionOverlay">
    <h2>📍 Marker-Based AR Drawing</h2>
    <p>Print or display this marker:</p>
    <div class="marker-hint">
        <p><strong>Download QR Code Marker</strong></p>
        <p style="font-size: 0.85rem; margin-top: 0.5rem;">Print or display a Hiro marker for stable AR placement</p>
        <div class="qr-download">
            <a href="https://raw.githubusercontent.com/jeromeetienne/AR.js/master/data/images/HIRO.jpg" target="_blank">📥 Download Hiro Marker</a>

    </div>
    <p style="margin-top: 1rem;">Point your camera at the marker to start drawing.</p>

<script>
    // Advanced AR Drawing App with Marker Detection
    class AdvancedARDrawingApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.camera = new THREE.Camera();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setClearColor(new THREE.Color('rgb(10, 14, 39)'), 1);
            document.body.appendChild(this.renderer.domElement);

            this.arToolkitSource = null;
            this.arToolkitContext = null;
            this.markerGroup = null;
            this.drawingCanvas = null;
            this.drawingTexture = null;
            this.isDrawing = false;
            this.drawingHistory = [];
            this.drawingColor = new THREE.Color(0x00f7ff);
            this.brushSize = 10;

            this.initialize();
            this.attachEventListeners();
        }

        async initialize() {
            try {
                // AR Source Setup
                this.arToolkitSource = new THREEx.ArToolkitSource({
                    sourceType: 'webcam',
                    sourceWidth: window.innerWidth,
                    sourceHeight: window.innerHeight
                });

                await new Promise((resolve) => {
                    this.arToolkitSource.init(resolve);
                });

                // AR Context Setup
                this.arToolkitContext = new THREEx.ArToolkitContext({
                    cameraParametersUrl: 'https://cdn.jsdelivr.net/npm/ar.js@2.2.2/three.js/data/camera_para.dat',
                    detectionMode: 'color',
                    canvasWidth: this.arToolkitSource.parameters.sourceWidth,
                    canvasHeight: this.arToolkitSource.parameters.sourceHeight
                });

                this.arToolkitContext.init(() => {
                    this.camera.projectionMatrix.copy(this.arToolkitContext.getProjectionMatrix());
                });

                // Marker Group
                this.markerGroup = new THREE.Group();
                this.scene.add(this.markerGroup);

                const markerControls = new THREEx.ArMarkerControls(
                    this.arToolkitContext,
                    this.markerGroup,
                    { type: 'pattern', patternUrl: 'https://cdn.jsdelivr.net/npm/ar.js@2.2.2/three.js/data/patt.hiro' }
                );

                // Setup Drawing Plane
                this.setupDrawingPlane();

                this.updateStatus('Marker Detected', true);
                document.getElementById('instructionOverlay').style.display = 'none';

                // Render loop
                this.render();
            } catch (err) {
                this.updateStatus('AR Error: ' + err.message, false);
                console.error('AR initialization failed:', err);
            }
        }

        setupDrawingPlane() {
            // Create canvas texture for drawing
            this.drawingCanvas = document.createElement('canvas');
            this.drawingCanvas.width = 1024;
            this.drawingCanvas.height = 1024;
            const ctx = this.drawingCanvas.getContext('2d');
            ctx.fillStyle = 'rgba(10, 14, 39, 0.3)';
            ctx.fillRect(0, 0, 1024, 1024);

            this.drawingTexture = new THREE.CanvasTexture(this.drawingCanvas);
            this.drawingTexture.magFilter = THREE.LinearFilter;
            this.drawingTexture.minFilter = THREE.LinearFilter;

            // Create plane geometry
            const geometry = new THREE.PlaneGeometry(1, 1);
            const material = new THREE.MeshBasicMaterial({
                map: this.drawingTexture,
                transparent: true,
                side: THREE.DoubleSide
            });

            const plane = new THREE.Mesh(geometry, material);
            plane.position.z = 0;
            this.markerGroup.add(plane);

            this.saveDrawingState();
        }

        attachEventListeners() {
            document.getElementById('toggleDrawingBtn').addEventListener('click', () => {
                this.isDrawing = !this.isDrawing;
                const btn = document.getElementById('toggleDrawingBtn');
                btn.textContent = this.isDrawing ? '⏹️ Stop Drawing' : '✏️ Start Drawing';
                btn.style.background = this.isDrawing ? 'linear-gradient(135deg, #ff006e 0%, #ff4365 100%)' : 'linear-gradient(135deg, #00f7ff 0%, #00c4d9 100%)';
            });

            document.getElementById('undoBtn').addEventListener('click', () => this.undo());
            document.getElementById('clearBtn').addEventListener('click', () => this.clear());
            document.getElementById('exportBtn').addEventListener('click', () => this.export());

            window.addEventListener('resize', () => this.onWindowResize());

            // Touch support
            document.addEventListener('touchstart', (e) => this.handleDrawingTouch(e, 'start'));
            document.addEventListener('touchmove', (e) => this.handleDrawingTouch(e, 'move'));
            document.addEventListener('touchend', () => this.handleDrawingTouch(null, 'end'));
        }

        handleDrawingTouch(event, type) {
            if (!this.isDrawing || !this.markerGroup) return;

            if (type === 'start' || type === 'move') {
                const touch = event.touches[0];
                const x = (touch.clientX / window.innerWidth) * this.drawingCanvas.width;
                const y = (touch.clientY / window.innerHeight) * this.drawingCanvas.height;

                this.drawOnCanvas(x, y, type === 'start');
            } else if (type === 'end') {
                this.saveDrawingState();
            }
        }

        drawOnCanvas(x, y, startNewPath) {
            const ctx = this.drawingCanvas.getContext('2d');
            ctx.fillStyle = `rgba(0, 247, 255, 0.8)`;
            ctx.beginPath();
            
            if (startNewPath) {
                ctx.moveTo(x, y);
            } else {
                ctx.arc(x, y, this.brushSize, 0, Math.PI * 2);
                ctx.fill();
            }

            this.drawingTexture.needsUpdate = true;
        }

        saveDrawingState() {
            this.drawingHistory.push(this.drawingCanvas.toDataURL());
            if (this.drawingHistory.length > 50) {
                this.drawingHistory.shift();
            }
            document.getElementById('undoBtn').disabled = this.drawingHistory.length <= 1;
            document.getElementById('clearBtn').disabled = false;
            document.getElementById('exportBtn').disabled = false;
        }

        undo() {
            if (this.drawingHistory.length > 1) {
                this.drawingHistory.pop();
                const previousState = this.drawingHistory[this.drawingHistory.length - 1];
                const img = new Image();
                img.onload = () => {
                    const ctx = this.drawingCanvas.getContext('2d');
                    ctx.clearRect(0, 0, this.drawingCanvas.width, this.drawingCanvas.height);
                    ctx.drawImage(img, 0, 0);
                    this.drawingTexture.needsUpdate = true;
                };
                img.src = previousState;
            }
        }

        clear() {
            const ctx = this.drawingCanvas.getContext('2d');
            ctx.fillStyle = 'rgba(10, 14, 39, 0.3)';
            ctx.fillRect(0, 0, 1024, 1024);
            this.drawingHistory = [];
            this.saveDrawingState();
            this.drawingTexture.needsUpdate = true;
        }

        export() {
            this.drawingCanvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ar-drawing-${Date.now()}.png`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        updateStatus(text, active) {
            document.getElementById('statusText').textContent = text;
            const dot = document.getElementById('statusDot');
            if (active) {
                dot.classList.add('active');
            } else {
                dot.classList.remove('active');
            }
        }

        onWindowResize() {
            this.arToolkitSource.onResizeElement();
            this.arToolkitSource.copyElementSizeTo(this.renderer.domElement);
            if (this.arToolkitContext.arController !== null) {
                this.arToolkitSource.copyElementSizeTo(this.arToolkitContext.arController.canvas);
            }
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        render = () => {
            requestAnimationFrame(this.render);

            if (this.arToolkitSource.ready === false) {
                return;
            }

            this.arToolkitContext.update(this.arToolkitSource.domElement);

            // Update marker visibility
            if (this.arToolkitContext.arController.timeCoded === false) {
                this.updateStatus('Searching for marker...', false);
            } else {
                this.updateStatus('Marker Found', true);
            }

            this.renderer.render(this.scene, this.camera);
        }
    }

    // Check if AR.js is available
    if (typeof THREEx !== 'undefined') {
        const app = new AdvancedARDrawingApp();
    } else {
        document.getElementById('instructionOverlay').innerHTML = `
            <h2>⚠️ AR Not Supported</h2>
            <p>Your browser doesn't support AR.js</p>
            <p style="margin-top: 1rem;">Please use:</p>
            <ul style="text-align: left; display: inline-block; margin-top: 0.5rem;">
                <li>Chrome on Android</li>
                <li>Safari on iOS 12+</li>
                <li>Edge or Firefox</li>
            </ul>
        `;
    }
</script>
