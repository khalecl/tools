    <div id="messageContainer"></div>

    <div class="section">
        <div class="section-title">📹 Videos to Merge</div>
        <div class="input-group">
            <label class="file-input-label" for="videoInput">
                + Add Videos

            <input type="file" id="videoInput" accept="video/*" multiple>
        </div>
        
        <div id="videoListContainer" class="empty-state">
            <div class="empty-state-icon">🎬</div>
            <div class="empty-state-text">Select videos to merge</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">⚡ Output Speed</div>
        <div class="speed-control">
            <div class="speed-display">
                <span class="speed-label">Playback Speed</span>
                <span class="speed-value"><span id="speedValue">1.0</span>x</span>
            </div>
            <input type="range" id="speedSlider" min="0.25" max="2" step="0.25" value="1">
            <div style="font-size: 11px; color: #64748b; text-align: center;">
                0.25x to 2x (slower to faster)
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">⚙️ Merge</div>
        <div class="buttons-group">
            <button class="btn-primary" id="mergeBtn" disabled>Merge Videos</button>
            <button class="btn-secondary" id="clearBtn">Clear</button>
        </div>
        
        <div id="progressSection" class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Preparing...</div>
        </div>
    </div>

    <div id="resultSection" class="section result-section">
        <div class="section-title">✅ Merged Successfully!</div>
        <div class="result-info" id="resultInfo"></div>
        <div class="video-controls">
            <button class="control-btn" id="downloadBtn">⬇️ Download</button>
            <button class="control-btn" id="shareBtn">📤 Share</button>
        </div>
    </div>
</div>

<script>
    class VideoMerger {
        constructor() {
            this.videos = [];
            this.mergedBlob = null;
            this.speed = 1.0;
            this.setupEventListeners();
        }

        setupEventListeners() {
            document.getElementById('videoInput').addEventListener('change', (e) => this.handleVideoSelect(e));
            document.getElementById('speedSlider').addEventListener('input', (e) => this.updateSpeed(e));
            document.getElementById('mergeBtn').addEventListener('click', () => this.mergeVideos());
            document.getElementById('clearBtn').addEventListener('click', () => this.clearAll());
            document.getElementById('downloadBtn').addEventListener('click', () => this.downloadVideo());
            document.getElementById('shareBtn').addEventListener('click', () => this.shareVideo());
        }

        handleVideoSelect(e) {
            const files = Array.from(e.target.files);
            
            if (files.length === 0) return;

            const validVideos = files.filter(file => {
                if (!file.type.startsWith('video/')) {
                    this.showMessage('Invalid file type. Please select video files.', 'error');
                    return false;
                }
                if (file.size > 500 * 1024 * 1024) {
                    this.showMessage(`${file.name} is too large (max 500MB)`, 'error');
                    return false;
                }
                return true;
            });

            this.videos.push(...validVideos);
            this.updateVideoList();
            this.showMessage(`Added ${validVideos.length} video(s)`, 'success');
        }

        updateVideoList() {
            const container = document.getElementById('videoListContainer');
            
            if (this.videos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎬</div>
                        <div class="empty-state-text">Select videos to merge</div>
                    </div>
                `;
                document.getElementById('mergeBtn').disabled = true;
                return;
            }

            container.innerHTML = `
                <ul class="video-list">
                    ${this.videos.map((video, idx) => `
                        <li class="video-item">
                            <div class="video-item-info">
                                <div class="video-item-name">${idx + 1}. ${video.name}</div>
                                <div class="video-item-size">${(video.size / 1024 / 1024).toFixed(1)}MB</div>
                            </div>
                            <button class="video-item-remove" onclick="merger.removeVideo(${idx})">Remove</button>
                        </li>
                    `).join('')}
                </ul>
            `;
            
            document.getElementById('mergeBtn').disabled = false;
        }

        removeVideo(index) {
            this.videos.splice(index, 1);
            this.updateVideoList();
        }

        updateSpeed(e) {
            this.speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = this.speed.toFixed(2);
        }

        async mergeVideos() {
            if (this.videos.length === 0) {
                this.showMessage('Please select videos to merge', 'error');
                return;
            }

            this.showProgress(true);
            document.getElementById('mergeBtn').disabled = true;

            try {
                // Create a temporary container for video metadata extraction
                const ffmpegScript = document.createElement('script');
                ffmpegScript.src = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js';
                document.head.appendChild(ffmpegScript);

                ffmpegScript.onload = async () => {
                    const { FFmpeg, fetchFile } = FFmpeg;
                    const ffmpeg = new FFmpeg.FFmpeg();

                    // Load FFmpeg WASM
                    await ffmpeg.load();
                    
                    try {
                        // Write all input videos to FFmpeg
                        for (let i = 0; i < this.videos.length; i++) {
                            const file = this.videos[i];
                            const data = await fetchFile(file);
                            ffmpeg.writeFile(`input${i}.mp4`, data);
                            
                            document.getElementById('progressText').textContent = 
                                `Loading videos: ${i + 1}/${this.videos.length}`;
                            document.getElementById('progressFill').style.width = 
                                ((i + 1) / this.videos.length * 50) + '%';
                        }

                        // Create concat file
                        let concatContent = '';
                        for (let i = 0; i < this.videos.length; i++) {
                            concatContent += `file 'input${i}.mp4'\n`;
                        }
                        ffmpeg.writeFile('concat.txt', concatContent);

                        document.getElementById('progressText').textContent = 'Merging videos...';
                        document.getElementById('progressFill').style.width = '50%';

                        // Build FFmpeg command with speed control
                        const speedFilter = this.speed !== 1.0 
                            ? `-filter:v "setpts=PTS/${this.speed}" -filter:a "atempo=${this.speed}"` 
                            : '';

                        // Execute merge command
                        await ffmpeg.exec([
                            '-f', 'concat',
                            '-safe', '0',
                            '-i', 'concat.txt',
                            '-c', 'copy',
                            'output.mp4'
                        ]);

                        // If speed is not 1.0, re-encode with speed filter
                        if (this.speed !== 1.0) {
                            await ffmpeg.exec([
                                '-i', 'output.mp4',
                                '-filter:v', `setpts=PTS/${this.speed}`,
                                '-filter:a', `atempo=${this.speed}`,
                                '-y',
                                'output_speed.mp4'
                            ]);
                            ffmpeg.deleteFile('output.mp4');
                            ffmpeg.renameFile('output_speed.mp4', 'output.mp4');
                        }

                        document.getElementById('progressFill').style.width = '90%';

                        // Read the output
                        const data = ffmpeg.readFile('output.mp4');
                        this.mergedBlob = new Blob([data.buffer], { type: 'video/mp4' });

                        ffmpeg.deleteFile('output.mp4');

                        this.showResult();
                        this.showMessage('Videos merged successfully!', 'success');
                        this.showProgress(false);
                        document.getElementById('mergeBtn').disabled = false;

                    } catch (error) {
                        throw error;
                    }
                };

                ffmpegScript.onerror = () => {
                    this.showMessage('Failed to load FFmpeg library', 'error');
                    this.showProgress(false);
                    document.getElementById('mergeBtn').disabled = false;
                };

            } catch (error) {
                console.error('Error merging videos:', error);
                this.showMessage(`Error: ${error.message || 'Failed to merge videos'}`, 'error');
                this.showProgress(false);
                document.getElementById('mergeBtn').disabled = false;
            }
        }

        showProgress(show) {
            document.getElementById('progressSection').classList.toggle('active', show);
        }

        showResult() {
            const resultSection = document.getElementById('resultSection');
            const sizeInMB = (this.mergedBlob.size / 1024 / 1024).toFixed(2);
            
            document.getElementById('resultInfo').innerHTML = `
                <strong>Merged File:</strong> ${sizeInMB}MB<br>
                <strong>Speed:</strong> ${this.speed}x<br>
                <strong>Videos Combined:</strong> ${this.videos.length}
            `;
            
            resultSection.classList.add('active');
        }

        downloadVideo() {
            if (!this.mergedBlob) return;

            const url = URL.createObjectURL(this.mergedBlob);
            const a = document.createElement('a');
            a.href = url;
            const timestamp = new Date().toISOString().split('T')[0];
            a.download = `merged-${this.speed}x-${timestamp}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            this.showMessage('Download started!', 'success');
        }

        async shareVideo() {
            if (!this.mergedBlob) return;

            try {
                const file = new File([this.mergedBlob], 'merged-video.mp4', { type: 'video/mp4' });
                
                if (navigator.share) {
                    await navigator.share({
                        files: [file],
                        title: 'VideoFlow - Merged Video',
                        text: `Merged video at ${this.speed}x speed`
                    });
                    this.showMessage('Video shared!', 'success');
                } else {
                    this.downloadVideo();
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error('Share error:', error);
                    this.downloadVideo();
                }
            }
        }

        clearAll() {
            this.videos = [];
            this.mergedBlob = null;
            this.speed = 1.0;
            document.getElementById('videoInput').value = '';
            document.getElementById('speedSlider').value = '1';
            document.getElementById('speedValue').textContent = '1.00';
            this.updateVideoList();
            this.showProgress(false);
            document.getElementById('resultSection').classList.remove('active');
        }

        showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            container.innerHTML = '';
            container.appendChild(message);

            setTimeout(() => {
                if (message.parentNode) {
                    message.remove();
                }
            }, 4000);
        }
    }

    const merger = new VideoMerger();
</script>
