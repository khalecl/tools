    <div id="messageContainer"></div>

    <div class="section">
        <div class="section-title">📹 Videos to Merge</div>
        <div class="input-group">
            <label class="file-input-label" for="videoInput">
                + Add Videos
            </label>
            <input type="file" id="videoInput" accept="video/*" multiple>
        </div>
        
        <div id="videoListContainer" class="empty-state">
            <div class="empty-state-icon">🎬</div>
            <div class="empty-state-text">Select videos to merge</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">⚙️ Merge</div>
        <div class="buttons-group">
            <button class="btn-primary" id="mergeBtn" disabled>Merge Videos</button>
            <button class="btn-secondary" id="clearBtn">Clear</button>
        </div>
        
        <div id="progressSection" class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Preparing...</div>
        </div>
    </div>

    <div id="resultSection" class="section result-section">
        <div class="section-title">✅ Done!</div>
        <div class="result-info" id="resultInfo"></div>
        <div class="video-controls">
            <button class="control-btn" id="downloadBtn">⬇️ Video</button>
            <button class="control-btn" id="screenshotBtn">📸 Screenshot</button>
            <button class="control-btn" id="shareBtn">📤 Share</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>

<script>
    class VideoMerger {
        constructor() {
            this.videos = [];
            this.mergedBlob = null;
            this.setupEventListeners();
        }

        setupEventListeners() {
            document.getElementById('videoInput').addEventListener('change', (e) => this.handleVideoSelect(e));
            document.getElementById('mergeBtn').addEventListener('click', () => this.mergeVideos());
            document.getElementById('clearBtn').addEventListener('click', () => this.clearAll());
            document.getElementById('downloadBtn').addEventListener('click', () => this.downloadVideo());
            document.getElementById('screenshotBtn').addEventListener('click', () => this.captureScreenshot());
            document.getElementById('shareBtn').addEventListener('click', () => this.shareVideo());
        }

        handleVideoSelect(e) {
            const files = Array.from(e.target.files);
            
            if (files.length === 0) return;

            const validVideos = files.filter(file => {
                if (!file.type.startsWith('video/')) {
                    this.showMessage('Invalid file type. Select video files.', 'error');
                    return false;
                }
                if (file.size > 500 * 1024 * 1024) {
                    this.showMessage(`${file.name} too large (max 500MB)`, 'error');
                    return false;
                }
                return true;
            });

            this.videos.push(...validVideos);
            this.updateVideoList();
            this.showMessage(`Added ${validVideos.length} video(s)`, 'success');
        }

        updateVideoList() {
            const container = document.getElementById('videoListContainer');
            
            if (this.videos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎬</div>
                        <div class="empty-state-text">Select videos to merge</div>
                    </div>
                `;
                document.getElementById('mergeBtn').disabled = true;
                return;
            }

            container.innerHTML = `
                <ul class="video-list">
                    ${this.videos.map((video, idx) => `
                        <li class="video-item">
                            <div class="video-item-info">
                                <div class="video-item-name">${idx + 1}. ${video.name}</div>
                                <div class="video-item-size">${(video.size / 1024 / 1024).toFixed(1)}MB</div>
                            </div>
                            <button class="video-item-remove" onclick="merger.removeVideo(${idx})">Remove</button>
                        </li>
                    `).join('')}
                </ul>
            `;
            
            document.getElementById('mergeBtn').disabled = false;
        }

        removeVideo(index) {
            this.videos.splice(index, 1);
            this.updateVideoList();
        }

        async mergeVideos() {
            if (this.videos.length === 0) {
                this.showMessage('Select videos to merge', 'error');
                return;
            }

            this.showProgress(true);
            document.getElementById('mergeBtn').disabled = true;

            try {
                const mergedChunks = [];

                // Load and process each video
                for (let i = 0; i < this.videos.length; i++) {
                    const file = this.videos[i];
                    const buffer = await this.readFile(file);
                    const uint8Array = new Uint8Array(buffer);
                    
                    // For MP4Box to work properly, we need to parse and rebuild the file
                    const mp4file = MP4Box.createFile();
                    mp4file.appendBuffer(uint8Array);
                    mp4file.flush();

                    mergedChunks.push(uint8Array);

                    const progress = ((i + 1) / this.videos.length) * 100;
                    document.getElementById('progressFill').style.width = progress + '%';
                    document.getElementById('progressText').textContent = 
                        `Processing: ${Math.round(progress)}% (${i + 1}/${this.videos.length})`;
                }

                // Merge all video buffers into single blob
                const mergedBuffer = this.concatenateBuffers(mergedChunks);
                this.mergedBlob = new Blob([mergedBuffer], { type: 'video/mp4' });

                this.showResult();
                this.showMessage('Videos merged successfully!', 'success');
                this.showProgress(false);
                document.getElementById('mergeBtn').disabled = false;

            } catch (error) {
                console.error('Error:', error);
                this.showMessage(`Error: ${error.message || 'Failed to merge'}`, 'error');
                this.showProgress(false);
                document.getElementById('mergeBtn').disabled = false;
            }
        }

        concatenateBuffers(buffers) {
            let totalLength = 0;
            for (let i = 0; i < buffers.length; i++) {
                totalLength += buffers[i].length;
            }

            const result = new Uint8Array(totalLength);
            let offset = 0;
            for (let i = 0; i < buffers.length; i++) {
                result.set(buffers[i], offset);
                offset += buffers[i].length;
            }
            return result;
        }

        readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        showProgress(show) {
            document.getElementById('progressSection').classList.toggle('active', show);
        }

        showResult() {
            const resultSection = document.getElementById('resultSection');
            const sizeInMB = (this.mergedBlob.size / 1024 / 1024).toFixed(2);
            
            document.getElementById('resultInfo').innerHTML = `
                <strong>✓ Merged File:</strong> ${sizeInMB}MB<br>
                <strong>✓ Videos Combined:</strong> ${this.videos.length}
            `;
            
            resultSection.classList.add('active');
        }

        downloadVideo() {
            if (!this.mergedBlob) return;

            const url = URL.createObjectURL(this.mergedBlob);
            const a = document.createElement('a');
            a.href = url;
            const date = new Date().toISOString().split('T')[0];
            a.download = `merged-${date}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            this.showMessage('Download started!', 'success');
        }

        captureScreenshot() {
            if (!this.mergedBlob) return;

            this.showMessage('Extracting last frame...', 'info');

            const video = document.createElement('video');
            const url = URL.createObjectURL(this.mergedBlob);
            video.src = url;
            video.crossOrigin = 'anonymous';

            video.onloadedmetadata = () => {
                video.currentTime = Math.max(0, video.duration - 0.1);
            };

            video.onseeked = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);

                    canvas.toBlob((blob) => {
                        const screenshotUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = screenshotUrl;
                        const date = new Date().toISOString().split('T')[0];
                        a.download = `screenshot-${date}.jpg`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(screenshotUrl);
                        URL.revokeObjectURL(url);
                        this.showMessage('Screenshot saved!', 'success');
                    }, 'image/jpeg', 0.95);
                } catch (error) {
                    console.error('Screenshot error:', error);
                    this.showMessage('Failed to capture screenshot', 'error');
                    URL.revokeObjectURL(url);
                }
            };

            video.onerror = () => {
                this.showMessage('Error loading video', 'error');
                URL.revokeObjectURL(url);
            };
        }

        async shareVideo() {
            if (!this.mergedBlob) return;

            try {
                const file = new File([this.mergedBlob], 'merged.mp4', { type: 'video/mp4' });
                
                if (navigator.share) {
                    await navigator.share({
                        files: [file],
                        title: 'VideoFlow',
                        text: 'Merged video'
                    });
                    this.showMessage('Shared!', 'success');
                } else {
                    this.downloadVideo();
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    this.downloadVideo();
                }
            }
        }

        clearAll() {
            this.videos = [];
            this.mergedBlob = null;
            document.getElementById('videoInput').value = '';
            this.updateVideoList();
            this.showProgress(false);
            document.getElementById('resultSection').classList.remove('active');
        }

        showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            container.innerHTML = '';
            container.appendChild(message);

            setTimeout(() => {
                if (message.parentNode) message.remove();
            }, 3000);
        }
    }

    const merger = new VideoMerger();
</script>
