    <div id="messageContainer"></div>

    <div class="section">

    <div class="section">

    <div class="section">

        <div id="progressSection" class="progress-section">

        <div class="video-controls">
            <button class="control-btn" id="downloadBtn" title="Download">⬇️</button>

<script>
    class VideoJoiner {
        constructor() {
            this.videos = [];
            this.joinedBlob = null;
            this.speed = 1.0;
            this.setupEventListeners();
        }

        setupEventListeners() {
            document.getElementById('videoInput').addEventListener('change', (e) => this.handleVideoSelect(e));
            document.getElementById('speedSlider').addEventListener('input', (e) => this.updateSpeed(e));
            document.getElementById('joinBtn').addEventListener('click', () => this.joinVideos());
            document.getElementById('clearBtn').addEventListener('click', () => this.clearAll());
            document.getElementById('downloadBtn').addEventListener('click', () => this.downloadVideo());
            document.getElementById('shareBtn').addEventListener('click', () => this.shareVideo());
        }

        handleVideoSelect(e) {
            const files = Array.from(e.target.files);
            
            if (files.length === 0) return;

            // Validate video files
            const validVideos = files.filter(file => {
                if (!file.type.startsWith('video/')) {
                    this.showMessage('Invalid file type. Please select video files.', 'error');
                    return false;
                }
                if (file.size > 500 * 1024 * 1024) { // 500MB limit
                    this.showMessage(`${file.name} is too large (max 500MB)`, 'error');
                    return false;
                }
                return true;
            });

            this.videos.push(...validVideos);
            this.updateVideoList();
            this.showMessage(`Added ${validVideos.length} video(s)`, 'success');
        }

        updateVideoList() {
            const container = document.getElementById('videoListContainer');
            
            if (this.videos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎬</div>
                        <div class="empty-state-text">Select videos to join</div>
                    </div>
                `;
                document.getElementById('joinBtn').disabled = true;
                return;
            }

            container.innerHTML = `
                <ul class="video-list">
                    ${this.videos.map((video, idx) => `
                        <li class="video-item">
                            <div class="video-item-info">
                                <div class="video-item-name">${idx + 1}. ${video.name}</div>
                                <div class="video-item-size">${(video.size / 1024 / 1024).toFixed(1)}MB</div>
                            </div>
                            <button class="video-item-remove" onclick="joiner.removeVideo(${idx})">Remove</button>
                        </li>
                    `).join('')}
                </ul>
            `;
            
            document.getElementById('joinBtn').disabled = false;
        }

        removeVideo(index) {
            this.videos.splice(index, 1);
            this.updateVideoList();
        }

        updateSpeed(e) {
            this.speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = this.speed.toFixed(2);
        }

        async joinVideos() {
            if (this.videos.length === 0) {
                this.showMessage('Please select videos to join', 'error');
                return;
            }

            this.showProgress(true);
            document.getElementById('joinBtn').disabled = true;

            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Get dimensions from first video
                const firstVideo = await this.loadVideoMetadata(this.videos[0]);
                canvas.width = firstVideo.videoWidth;
                canvas.height = firstVideo.videoHeight;

                // Create MediaRecorder with appropriate codec
                const stream = canvas.captureStream(30);
                const mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/mp4',
                    videoBitsPerSecond: 5000000
                });

                const chunks = [];
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    this.joinedBlob = new Blob(chunks, { type: 'video/mp4' });
                    this.showPreview();
                    this.showMessage('Videos joined successfully!', 'success');
                    this.showProgress(false);
                    document.getElementById('joinBtn').disabled = false;
                };

                mediaRecorder.start();
                await this.playVideosSequentially(canvas, ctx, firstVideo, mediaRecorder);
            } catch (error) {
                console.error('Error joining videos:', error);
                this.showMessage(`Error: ${error.message}`, 'error');
                this.showProgress(false);
                document.getElementById('joinBtn').disabled = false;
            }
        }

        async loadVideoMetadata(file) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                const url = URL.createObjectURL(file);
                
                video.onloadedmetadata = () => {
                    resolve(video);
                };
                
                video.onerror = reject;
                video.src = url;
            });
        }

        async playVideosSequentially(canvas, ctx, baseVideo, mediaRecorder) {
            const totalDuration = await this.calculateTotalDuration();
            const startTime = Date.now();

            for (let i = 0; i < this.videos.length; i++) {
                const videoFile = this.videos[i];
                const video = await this.loadVideoMetadata(videoFile);
                const url = URL.createObjectURL(videoFile);
                video.src = url;
                
                await new Promise((resolve) => {
                    video.play().then(() => {
                        const playDuration = (video.duration / this.speed) * 1000;
                        let lastTime = Date.now();

                        const renderFrame = () => {
                            const elapsed = Date.now() - startTime;
                            const progress = (elapsed / totalDuration) * 100;
                            
                            document.getElementById('progressFill').style.width = progress + '%';
                            document.getElementById('progressText').textContent = 
                                `Processing: ${Math.round(progress)}% (Video ${i + 1}/${this.videos.length})`;

                            if (!video.paused && !video.ended) {
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                requestAnimationFrame(renderFrame);
                            } else {
                                resolve();
                            }
                        };

                        video.playbackRate = this.speed;
                        video.onended = resolve;
                        renderFrame();
                    });
                });

                URL.revokeObjectURL(url);
            }

            mediaRecorder.stop();
        }

        async calculateTotalDuration() {
            let total = 0;
            for (const file of this.videos) {
                const video = await this.loadVideoMetadata(file);
                total += (video.duration / this.speed) * 1000;
            }
            return total;
        }

        showProgress(show) {
            document.getElementById('progressSection').classList.toggle('active', show);
        }

        showPreview() {
            const video = document.getElementById('previewVideo');
            const url = URL.createObjectURL(this.joinedBlob);
            video.src = url;
            document.getElementById('previewSection').classList.add('active');
        }

        downloadVideo() {
            if (!this.joinedBlob) return;

            const url = URL.createObjectURL(this.joinedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `joined-video-${this.speed}x-${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            this.showMessage('Video downloaded!', 'success');
        }

        async shareVideo() {
            if (!this.joinedBlob) return;

            try {
                const file = new File([this.joinedBlob], 'joined-video.mp4', { type: 'video/mp4' });
                
                if (navigator.share) {
                    await navigator.share({
                        files: [file],
                        title: 'VideoFlow - Joined Video',
                        text: `Joined video at ${this.speed}x speed`
                    });
                    this.showMessage('Video shared!', 'success');
                } else {
                    this.downloadVideo();
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error('Share error:', error);
                }
            }
        }

        clearAll() {
            this.videos = [];
            this.joinedBlob = null;
            this.speed = 1.0;
            document.getElementById('videoInput').value = '';
            document.getElementById('speedSlider').value = '1';
            document.getElementById('speedValue').textContent = '1.00';
            this.updateVideoList();
            this.showProgress(false);
            document.getElementById('previewSection').classList.remove('active');
        }

        showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            container.innerHTML = '';
            container.appendChild(message);

            setTimeout(() => {
                if (message.parentNode) {
                    message.remove();
                }
            }, 3000);
        }
    }

    const joiner = new VideoJoiner();
</script>
